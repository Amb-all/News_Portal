{% extends "news/default.html" %}

{% block title %}Список статей{% endblock %}

{% block content %}
<h2>Статьи</h2>
<ul>
  {% for post in posts %}
    <li>
      <strong>{{ post.title }}</strong><br>
      {{ post.created_at }}<br>
      {{ post.content|slice:":20" }}...
    </li>
  {% endfor %}
</ul>
{% endblock %}
